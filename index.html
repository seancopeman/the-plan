let cD=new Date(),aT="daily",chk={},rf={},ex={},pS={},wO=0;
try{let s=localStorage.getItem("tp-chk");if(s)chk=JSON.parse(s)}catch(e){}
try{let s=localStorage.getItem("tp-rf");if(s)rf=JSON.parse(s)}catch(e){}
function sv(){try{localStorage.setItem("tp-chk",JSON.stringify(chk))}catch(e){}try{localStorage.setItem("tp-rf",JSON.stringify(rf))}catch(e){}}

function dk(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function isTd(d){let n=new Date();return d.toDateString()===n.toDateString()}
function fmt(d){return d.toLocaleDateString("en-CA",{month:"long",day:"numeric",year:"numeric"})}
function fmtS(d){return d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})}
function tmrwDate(d){let t=new Date(d);t.setDate(t.getDate()+1);return t}
function ystrDate(d){let t=new Date(d);t.setDate(t.getDate()-1);return t}

function getI(di){let m=cD.getMonth(),warm=m>=3&&m<=9,r=[];for(let b of HB){let it=b.items.filter(i=>{if(i.s&&((i.s==="warm"&&!warm)||(i.s==="cold"&&warm)))return false;return i.d==="all"||i.d.includes(di)});if(it.length)r.push({...b,items:it})}return r}

function getCtx(di){
  if(OFC.includes(di))return"🏢 Office day — walk commute, deep focus, learning block at 4:30";
  if(di===5)return"🎉 Friday — date night tonight. Be present. Be romantic.";
  if(di===0||di===6)return"☕ Weekend — recharge, explore, be spontaneous. Stay consistent on habits.";
  return"🏠 Remote day — protect your morning routine and focus time."
}
function getPh(d){let w=Math.floor((d-ST)/(7*864e5));if(w<0)return{n:1,nm:"Foundation",c:"#D4A030",ds:"Small wins, big momentum."};if(w<2)return{n:1,nm:"Foundation",c:"#D4A030",ds:"Small wins, big momentum."};if(w<6)return{n:2,nm:"Building",c:"#5B8C5A",ds:"Layer in new habits one at a time."};if(w<12)return{n:3,nm:"Deepening",c:"#6B5B8A",ds:"Go deeper on what matters most."};return{n:4,nm:"Sustaining",c:"#3A7CA5",ds:"Maintain momentum. Reflect and adjust."}}

function sP(arr,seed,cnt){let h=0;for(let i=0;i<seed.length;i++){h=((h<<5)-h)+seed.charCodeAt(i);h|=0}let idx=[];for(let i=0;i<cnt&&i<arr.length;i++){let x=Math.abs((h*(i+1)*2654435761)%arr.length),tr=0;while(idx.includes(x)&&tr<arr.length){x=(x+1)%arr.length;tr++}idx.push(x)}return idx.map(i=>arr[i])}
function shuf(tp){let k="s-"+tp+"-"+dk(cD);pS[k]=(pS[k]||0)+1;render()}
function gSd(tp){let k="s-"+tp+"-"+dk(cD);return dk(cD)+"-"+(pS[k]||0)}

function exC(e,cl){
  let sd=gSd(e.tp),h="";
  const mp={
    pq:()=>{let p=sP(PQ,sd,3);h+=`<div class="olbl">Tonight's options — pick one that feels right:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">"${x.q}"</div><div class="ont">${x.n}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('pq')">↻ Different questions</button>`},
    em:()=>{let p=sP(EM,sd,5);h+=`<div class="olbl">Which of these resonates today?</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('em')">↻ Show different</button>`},
    jn:()=>{let p=sP(JN,sd,2);h+=`<div class="olbl">Tonight's journal prompt:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x.p}</div><div class="ont">${x.c}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('jn')">↻ Different prompt</button>`},
    fm:()=>{let p=sP(FM,sd,3);h+=`<div class="olbl">Copy-paste or adapt — don't overthink it:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">"${x}"</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('fm')">↻ Different messages</button>`},
    to:()=>{let p=sP(TO,sd,3);h+=`<div class="olbl">Toronto ideas for today:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('to')">↻ Different ideas</button>`},
    rc:()=>{let p=sP(RC,sd,3);h+=`<div class="olbl">This week's recipe challenge:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x.m}</div><div class="ont">${x.n}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('rc')">↻ Different recipes</button>`},
    ln:()=>{let p=sP(LN,sd,2);h+=`<div class="olbl">Today's 4:30pm learning focus:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x.t}</div><div class="ont">${x.n}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('ln')">↻ Different topic</button>`},
    ck:()=>{let p=sP(CK,sd,2);h+=`<div class="olbl">This month's cocktail to master:</div>`;p.forEach(x=>{h+=`<div class="opt" style="border-left-color:${cl}"><div class="otx">${x.m}</div><div class="ont">${x.n}</div></div>`});h+=`<button class="shuf" onclick="event.stopPropagation();shuf('ck')">↻ Different cocktail</button>`},
  };
  if(mp[e.tp])mp[e.tp]();
  return h;
}

function gDS(d){let di=d.getDay(),bs=getI(di),k=dk(d),tot=0,dn=0,byB={};for(let b of bs){let bt=0,bd=0;for(let i of b.items){tot++;bt++;if(chk[k+":"+i.t]){dn++;bd++}}byB[b.b]={t:bt,d:bd}}return{tot,dn,pct:tot?Math.round(dn/tot*100):0,byB}}
function gWD(o){let n=new Date(),m=new Date(n);m.setDate(n.getDate()-n.getDay()+1+(o*7));let ds=[];for(let i=0;i<7;i++){let d=new Date(m);d.setDate(m.getDate()+i);ds.push(d)}return ds}
function gStrk(){let s=0,d=new Date();if(gDS(d).pct<100)d.setDate(d.getDate()-1);for(let i=0;i<365;i++){let st=gDS(d);if(st.tot===0){d.setDate(d.getDate()-1);continue}if(st.pct>=70)s++;else break;d.setDate(d.getDate()-1)}return s}

// ── Tomorrow preview items ──
function tmrwPreview(){
  let td=tmrwDate(cD),di=td.getDay(),bs=getI(di);
  let specials=[];
  for(let b of bs)for(let it of b.items){if(it.sp)specials.push({t:it.t,cl:b.cl,ic:b.ic})}
  // Show context + count + any special items
  let dayName=DY[di];
  let isOfc=OFC.includes(di);
  let total=bs.reduce((s,b)=>s+b.items.length,0);
  let h=`<div class="tmrw-peek" onclick="cD=new Date(${td.getTime()});render()">
    <div class="tmrw-hdr"><div class="tmrw-title">Tomorrow · ${dayName}</div><div class="tmrw-arrow">→</div></div>
    <div class="tmrw-items">
      <span class="tmrw-chip">${total} habits</span>
      ${isOfc?'<span class="tmrw-chip">🏢 Office</span>':''}
      ${di===5?'<span class="tmrw-chip hl" style="background:#D4A03018;color:#D4A030">💛 Date night</span>':''}
      ${di===0||di===6?'<span class="tmrw-chip">☕ Weekend</span>':''}
      ${di===6?'<span class="tmrw-chip">🎬 Movie night</span>':''}`;
  // Show unique items for tomorrow
  let uniq=[];
  for(let b of bs)for(let it of b.items){if(it.d!=="all"&&!uniq.includes(it.t))uniq.push(it.t)}
  uniq.slice(0,3).forEach(u=>{h+=`<span class="tmrw-chip">${u.length>40?u.slice(0,38)+'…':u}</span>`});
  h+=`</div></div>`;
  return h;
}

// ── Render: Daily ──
function rD(){
  let di=cD.getDay(),bs=getI(di),key=dk(cD),ph=getPh(cD),ctx=getCtx(di),td=isTd(cD);
  let tot=0,dn=0;for(let b of bs)for(let i of b.items){tot++;if(chk[key+":"+i.t])dn++}
  let pct=tot?Math.round(dn/tot*100):0;

  let tmrw=tmrwDate(cD),ystr=ystrDate(cD);
  let tdPill=td,tmrwPill=isTd(ystr),ystrPill=isTd(tmrw); // which pill is "active"

  let h=`<div class="hdr"><div class="nav">
    <button class="nbtn" onclick="goD(-1)">‹</button>
    <div class="dctr"><div class="dsup">${td?"Today":DY[di]}</div><div class="dmn">${td?DY[di]:fmt(cD)}</div>${td?`<div class="dsub">${fmt(cD)}</div>`:""}</div>
    <button class="nbtn" onclick="goD(1)">›</button></div>
    <div class="qpills">
      <button class="qpill${isTd(ystrDate(cD))?" on":""}" onclick="cD=ystrDate(cD);render()">Yesterday</button>
      <button class="qpill${td?" on":""}" onclick="goTd()">Today</button>
      <button class="qpill${isTd(tmrwDate(cD))?" on":""}" onclick="cD=tmrwDate(cD);render()">Tomorrow</button>
    </div>
    <div class="phrow"><span class="phbdg" style="background:${ph.c}35;color:${ph.c}">Phase ${ph.n}: ${ph.nm}</span></div>
    <div class="prsec"><div class="prmeta"><span>${dn}/${tot} completed</span><span>${pct}%</span></div>
    <div class="prtrk"><div class="prfil" style="width:${pct}%;background:${pct===100?'linear-gradient(90deg,#5B8C5A,#7ab879)':'linear-gradient(90deg,#D4A030,#e8c060)'}"></div></div></div></div>
    <div class="ctxbar">${ctx}</div><div class="clist">`;

  for(let b of bs){
    let bd=b.items.filter(i=>chk[key+":"+i.t]).length;
    h+=`<div class="bgrp"><div class="bhdr"><span class="bico">${b.ic}</span><span class="blbl" style="color:${b.cl}">${b.b}</span><span class="bcnt">${bd}/${b.items.length}</span></div>`;
    for(let it of b.items){
      let ik=key+":"+it.t,isDn=!!chk[ik],eid=ik+":ex",isEx=ex[eid];
      let spSt=it.sp?`border-left-color:${b.cl};background:${b.cl}08;`:"";
      h+=`<div class="hitm${isDn?" dn":""}${it.sp?" sp":""}" style="${spSt}">
        <div class="chk${isDn?" checked":""}" style="${isDn?`border-color:${b.cl};background:${b.cl}20;color:${b.cl}`:""}" onclick="tog('${ik.replace(/'/g,"\\'")}')">${isDn?"✓":""}</div>
        <div class="htx" onclick="tog('${ik.replace(/'/g,"\\'")}')">${it.t}</div>`;
      if(it.ex){h+=`<button class="xbtn${isEx?" opn":""}" onclick="event.stopPropagation();tEx('${eid.replace(/'/g,"\\'")}')">${isEx?"▾ Hide":"▸ "+it.ex.lb}</button>`;if(isEx)h+=`<div class="xpnl" onclick="event.stopPropagation()">${exC(it.ex,b.cl)}</div>`}
      h+=`</div>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;

  if(pct===100)h+=`<div class="cmsg">All done today. You showed up. That matters. 💛</div>`;

  // Tomorrow preview (only show when viewing today or past)
  if(td)h+=tmrwPreview();

  h+=`<div class="ftr">${!td?`<button class="tbtn" onclick="goTd()">← BACK TO TODAY</button>`:""}<div class="pdsc">${ph.ds}</div></div>`;
  return h;
}

// ── Render: Weekly ──
function rW(){
  let ds=gWD(wO),strk=gStrk(),dayS=ds.map(d=>gDS(d)),bT={};
  for(let s of dayS)for(let[bn,bs] of Object.entries(s.byB)){if(!bT[bn])bT[bn]={t:0,d:0};bT[bn].t+=bs.t;bT[bn].d+=bs.d}
  let wTot=dayS.reduce((s,d)=>s+d.tot,0),wDn=dayS.reduce((s,d)=>s+d.dn,0),wP=wTot?Math.round(wDn/wTot*100):0;
  let bM={};for(let b of HB)bM[b.b]={cl:b.cl,ic:b.ic};

  let h=`<div class="wv"><div class="wnav">
    <button class="wnbtn" onclick="wO--;render()">‹</button>
    <div><div class="whdr">Week of ${fmtS(ds[0])}</div><div class="wsub">${fmtS(ds[0])} – ${fmtS(ds[6])}, ${ds[6].getFullYear()}</div></div>
    <button class="wnbtn" onclick="wO++;render()">›</button></div>`;

  h+=`<div class="ddots">`;ds.forEach(d=>{let s=gDS(d),c=s.pct>=80?"#5B8C5A":s.pct>=50?"#D4A030":s.pct>0?"#C0564B":"#eee",tc=s.pct>0?"#fff":"#ccc",td=isTd(d);
    h+=`<div class="ddot" onclick="cD=new Date(${d.getTime()});aT='daily';render()"><div class="ddlbl">${DS[d.getDay()]}</div><div class="ddcirc" style="background:${c};color:${tc};${td?'box-shadow:0 0 0 2px #D4A030;':''}">${s.pct>0?s.pct+"%":"-"}</div></div>`});
  h+=`</div>`;

  h+=`<div style="margin-top:20px;padding:14px 0;border-bottom:1px solid #f0ece4"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-family:var(--mn);color:var(--tx2)">Overall</span><span style="font-size:16px;font-family:var(--mn);font-weight:500;color:${wP>=70?'#5B8C5A':'#D4A030'}">${wP}%</span></div><div class="prtrk" style="background:#f0ece4;height:6px"><div class="prfil" style="width:${wP}%;background:${wP>=70?'linear-gradient(90deg,#5B8C5A,#7ab879)':'linear-gradient(90deg,#D4A030,#e8c060)'}"></div></div></div>`;

  h+=`<div style="margin-top:16px">`;
  for(let[bn,bs] of Object.entries(bT)){let m=bM[bn]||{cl:"#999",ic:"·"},p=bs.t?Math.round(bs.d/bs.t*100):0;
    h+=`<div class="brow"><span class="brico">${m.ic}</span><span class="brnm" style="color:${m.cl}">${bn}</span><div class="brbar"><div class="brfil" style="width:${p}%;background:${m.cl}"></div></div><span class="brpct" style="color:${m.cl}">${p}%</span></div>`}
  h+=`</div>`;

  h+=`<div class="stk"><div class="stktl">Current Streak (70%+ days)</div><div style="display:flex;align-items:baseline;gap:8px"><span class="stkn">${strk}</span><span class="stkl">${strk===1?"day":"days"} in a row</span></div></div>`;

  h+=`<div class="trsec"><div class="trtl">Weekly Trend</div>`;
  for(let wo=wO-7;wo<=wO;wo++){let wd=gWD(wo),ws=wd.map(d=>gDS(d)),wt=ws.reduce((s,d)=>s+d.tot,0),wdn=ws.reduce((s,d)=>s+d.dn,0),wp=wt?Math.round(wdn/wt*100):0;if(wt===0)continue;let lb=fmtS(wd[0]),ic=wo===wO;
    h+=`<div class="trrow"><span class="trwk">${lb}</span><div class="trbt"><div class="trbf" style="width:${wp}%;background:${ic?'var(--gold)':'#ccc'}"></div></div><span class="trpc" style="color:${ic?'var(--gold)':'var(--tx3)'}">${wp}%</span></div>`}
  h+=`</div>`;

  let wk="wk-"+dk(ds[0]),rp=["What went well this week?","What did I struggle with?","How did I show up for my partner?","What will I focus on next week?","What am I most proud of?"];
  h+=`<div class="rfsec"><div class="rftl">Weekly Reflection</div>`;
  rp.forEach((p,i)=>{let rk=wk+"-"+i,v=rf[rk]||"";h+=`<div class="rfp">${p}</div><textarea class="rfin" placeholder="Write here..." oninput="sRf('${rk}',this.value)">${v}</textarea>`});
  h+=`</div></div>`;
  return h;
}

function render(){
  let h=`<div class="tabs"><button class="tab${aT==='daily'?' on':''}" onclick="aT='daily';render()">Today</button><button class="tab${aT==='weekly'?' on':''}" onclick="aT='weekly';render()">Weekly Review</button></div>`;
  h+=aT==='daily'?rD():rW();
  document.getElementById("app").innerHTML=h;
}

function goD(o){cD=new Date(cD);cD.setDate(cD.getDate()+o);render()}
function goTd(){cD=new Date();render()}
function tog(k){chk[k]=!chk[k];if(!chk[k])delete chk[k];sv();render()}
function tEx(k){ex[k]=!ex[k];render()}
function sRf(k,v){rf[k]=v;sv()}
function tmrwDate(d){let t=new Date(d);t.setDate(t.getDate()+1);return t}
function ystrDate(d){let t=new Date(d);t.setDate(t.getDate()-1);return t}

let tsx=0,tsy=0;
document.addEventListener("touchstart",e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.5){if(aT==="daily"){dx>0?goD(-1):goD(1)}else{dx>0?wO--:wO++;render()}}},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA")return;if(e.key==="ArrowLeft"){aT==="daily"?goD(-1):(wO--,render())}if(e.key==="ArrowRight"){aT==="daily"?goD(1):(wO++,render())}});

// ── PWA Service Worker ──
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}

render();
</script>
</body>
</html>
